name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions: {}

concurrency:
  group: pr-ci-ci.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
